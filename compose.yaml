name: flakey

services:
  studio-runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
      args:
        BUN_VERSION: "1.3.12"
        PLAYWRIGHT_VERSION: "1.61.1"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENRICHMENT_MODEL: ${OPENAI_ENRICHMENT_MODEL:-gpt-5.6}
      STUDIO_HOST: 0.0.0.0
      STUDIO_HOST_GATEWAY: host.docker.internal
      STUDIO_INTERNAL_ORIGIN: http://web:8080
      STUDIO_DATA_DIR: /var/lib/flakey
      STUDIO_PORT: 8787
      STUDIO_PUBLIC_ORIGIN: ${FLAKEY_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      STUDIO_RUNTIME: container
    expose:
      - "8787"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    volumes:
      - studio-data:/var/lib/flakey
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp_profile.json
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/api/studio/health');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    restart: unless-stopped
    networks:
      - studio

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        BUN_VERSION: "1.3.12"
    environment:
      STUDIO_RUNNER_URL: http://studio-runner:8787
      WEB_INTERNAL_ORIGIN: http://web:8080
      WEB_PUBLIC_ORIGIN: ${FLAKEY_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      WEB_ROOT: /app/dist
    depends_on:
      studio-runner:
        condition: service_healthy
    ports:
      - "${FLAKEY_BIND:-127.0.0.1}:${FLAKEY_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8080/healthz');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped
    networks:
      - studio

networks:
  studio:
    driver: bridge

volumes:
  studio-data:
