name: Flakey Patch
run-name: Flakey Patch task ${{ github.event.client_payload.key || inputs.key }}

on:
  repository_dispatch:
    types: [flakey_patch]
  workflow_dispatch:
    inputs:
      key:
        description: Validated Slack thread hash (sent by the receiver)
        required: true
        type: string
      encrypted_request:
        description: Authenticated encrypted Slack event (sent by the receiver)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: flakey-patch-${{ github.event.client_payload.key || inputs.key }}
  cancel-in-progress: false
  queue: max

jobs:
  agent:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: agents/pr-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate encrypted request and locate trusted state
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLAKEY_STATE_KEY: ${{ secrets.FLAKEY_STATE_KEY }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_TEAM_ID: T0C4U18AUC9
        run: bun --no-env-file scripts/resolve-action.ts
      - name: Restore encrypted task state
        if: steps.state.outputs.artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.state.outputs.artifact_id }}
          run-id: ${{ steps.state.outputs.run_id }}
          github-token: ${{ github.token }}
          path: agents/pr-agent/.runtime/state
          merge-multiple: true
      - name: Code, verify, publish draft and check Greptile
        env:
          LANGSMITH_TRACING: "true"
          LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
          LANGSMITH_PROJECT: slack-to-pr
          LANGSMITH_WORKSPACE_ID: 6e46b5a9-5679-4086-b645-c0a87ba20dbb
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_AGENT_MODEL: gpt-6-astra
          SLACK_TEAM_ID: T0C4U18AUC9
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          FLAKEY_APPROVER_SLACK_ID: U0C4RUL6CMQ
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_HISTORY_TOKEN: ${{ secrets.SLACK_HISTORY_TOKEN }}
          FLAKEY_GITHUB_TOKEN: ${{ secrets.FLAKEY_GITHUB_TOKEN }}
          FLAKEY_STATE_KEY: ${{ secrets.FLAKEY_STATE_KEY }}
          FLAKEY_SANDBOX_SNAPSHOT: flakey-pr-agent-v1
        run: bun --no-env-file scripts/run-action.ts
      - name: Save encrypted task state, including failed runs
        if: always() && steps.state.outputs.key != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flakey-state-${{ steps.state.outputs.key }}
          path: agents/pr-agent/.runtime/state/state.enc
          retention-days: 90
          include-hidden-files: true
          overwrite: true
          if-no-files-found: ignore
